version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - VITE_API_URL=/api
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/enquiry_db
    ports:
      - "5000:5000"
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - app-network

  mongo:
    image: mongo:6.0
    container_name: mongo
    volumes:
      - mongodb_data:/data/db
    command: ["--bind_ip_all", "--noauth"]
    networks:
      - app-network

networks:
  app-network:
    name: fullstack_enquiry_app-network
    driver: bridge

volumes:
  mongodb_data:
    driver: local
